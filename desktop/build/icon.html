<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
  .tile {
    width: 512px; height: 512px;
    background: linear-gradient(145deg, #2f6df6 0%, #5b8dff 55%, #7aa2ff 100%);
    border-radius: 112px;
    display: grid; place-items: center;
  }
  .glyph {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 296px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
    transform: translateY(-10px);
    text-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
  }
</style>
</head>
<body><div class="tile"><div class="glyph">妙</div></div></body>
</html>
